name: TARS
options:
  bundleIdPrefix: com.orsen
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: TARS
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_PREVIEWS: YES

targets:
  TARS:
    type: application
    platform: iOS
    sources:
      - path: TARS
    info:
      path: TARS/Resources/Info.plist
      properties:
        CFBundleDisplayName: TARS
        UILaunchStoryboardName: LaunchScreen
        NSCameraUsageDescription: "TARS 需要相机权限以拍照发送给 Agent 分析。"
        NSMicrophoneUsageDescription: "TARS 需要麦克风权限以支持语音输入对话。"
        NSPhotoLibraryUsageDescription: "TARS 需要相册权限以选取照片发送给 Agent 分析。"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orsen.tars
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    scheme:
      gatherCoverageData: false

schemes:
  TARS:
    build:
      targets:
        TARS: all
    run:
      config: Debug

